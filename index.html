<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0a0f16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Model Paneli">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Model Analiz Paneli</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet">
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script crossorigin="anonymous" src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
<style>
:root{--tx:#e8eef5;--mut:#7f93a8;--bd:rgba(255,255,255,.1);--gl:rgba(255,255,255,.04);--hd:rgba(10,15,22,.85);--dc:rgba(0,0,0,.24);--track:rgba(255,255,255,.1);--donut:#cbd5e1;--lnk:#74c0fc;--sel:#111a24;--pb:rgba(255,255,255,.08);
--leg:#9fb1c4;--grid:rgba(255,255,255,.06);--grid2:rgba(255,255,255,.12);--tipbg:rgba(10,15,22,.95);--fg:#ffffff;--bgc:#0a0f16;
--page:radial-gradient(1200px 600px at 10% -10%,#17325a 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#2b1a4d 0,transparent 55%),#0a0f16}
[data-theme=light]{--tx:#14202b;--mut:#5b6b7b;--bd:rgba(20,40,60,.14);--gl:rgba(255,255,255,.8);--hd:rgba(244,247,250,.9);--dc:rgba(20,40,60,.05);--track:rgba(20,40,60,.1);--donut:#64748b;--lnk:#1971c2;--sel:#fff;--pb:rgba(20,40,60,.08);
--leg:#475569;--grid:rgba(20,40,60,.08);--grid2:rgba(20,40,60,.16);--tipbg:rgba(255,255,255,.97);--fg:#1b2733;--bgc:#f2f5f9;
--page:radial-gradient(1000px 500px at 10% -10%,#dbe9fb 0,transparent 60%),radial-gradient(800px 400px at 100% 0,#eadffb 0,transparent 55%),#f2f5f9}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;background:var(--page);background-attachment:fixed}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--bd);backdrop-filter:blur(10px);position:sticky;top:0;z-index:1000;background:var(--hd)}
h1{font-size:19px;margin:0 10px 0 0}
h1 span{background:linear-gradient(90deg,#ff922b,#4dabf7,#69db7c);-webkit-background-clip:text;color:transparent}
select,input,button{font:inherit;color:var(--tx);background:var(--gl);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;outline:0}
select option,select optgroup{background:var(--sel);color:var(--tx)}
button{cursor:pointer}
button.on{background:rgba(77,171,247,.25);border-color:#4dabf7}
.mini{padding:2px 8px;font-size:11px;border-radius:6px}
#go{background:linear-gradient(135deg,#1c7ed6,#7048e8);border:0;font-weight:600;color:#fff}
.seg{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.sp2{flex:1}
.brk{flex-basis:100%;height:0}
.ib{display:inline-flex;align-items:center;justify-content:center;padding:6px 10px}
#go{display:inline-flex;align-items:center;justify-content:center}
main{max-width:1350px;margin:auto;padding:16px 22px}
.models{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.mc{display:flex;align-items:center;gap:8px;padding:4px 6px 4px 12px;border:1px solid var(--bd);border-radius:999px;background:var(--gl);font-size:12px}
.mc.off{opacity:.4}
.mn{cursor:pointer;color:var(--c);font-weight:600;display:flex;align-items:center;gap:6px}
.mn i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.mc select{font-size:12px;padding:3px 6px;border-radius:999px;max-width:128px}
.mc .run{color:var(--mut);font-size:11px}
.card{border:1px solid var(--bd);border-radius:16px;padding:14px;background:var(--gl);margin-bottom:14px}
.card h2{font-size:12px;margin:0 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.card h2 .seg{text-transform:none;letter-spacing:0}
.hd{cursor:grab;margin-right:6px;font-size:14px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.dc{min-width:172px;flex:1;background:var(--dc);border:1px solid var(--bd);border-radius:16px;padding:12px 13px}
.dc .d1{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.dc .ic{font-size:24px}
.tt{font-size:26px;font-weight:700;line-height:1.1;margin:2px 0 4px}
.tt span{font-size:16px;color:var(--mut);font-weight:500}
.sub{font-size:11px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px}
.row b{color:var(--tx)}
.pbar{height:6px;border-radius:4px;background:var(--pb);overflow:hidden;margin-top:4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#4dabf7,#7048e8);border-radius:4px}
.ar{display:inline-block;color:var(--lnk)}
.cl{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--bd)}
.cl div{font-size:10.5px;line-height:1.35;color:var(--mut)}
details{margin-top:6px}
summary{cursor:pointer;color:var(--lnk);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(520px,1fr));gap:16px}
.grid .card{margin:0}
.grid .card.over{outline:2px dashed #4dabf7}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.ch{position:relative}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap;font-size:12.5px}
th{color:var(--mut);font-size:11px;font-weight:600}
td:first-child,th:first-child{text-align:left}
#st{color:var(--mut);font-size:12px;padding:10px 22px 0;max-width:1350px;margin:auto}
.err{color:#ff6b6b}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:12.5px}
#mapbox{height:600px;border-radius:12px;overflow:hidden;background:var(--dc)}
.mapw{position:relative}
.legend{position:absolute;left:10px;bottom:34px;z-index:2;width:268px;max-height:78%;overflow:auto;padding:9px 12px 10px;border-radius:12px;font-size:11px;line-height:1.35;color:#e8eef5;background:rgba(10,15,22,.86);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.lg-h{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:100%;cursor:pointer;font-weight:700;font-size:11.5px;color:#e8eef5}
.lg-h .chev{transition:transform .2s;opacity:.7}
.legend.c .lg-b{display:none}
.legend.c .chev{transform:rotate(-90deg)}
.lg-b{margin-top:7px}
.legend .bar{height:11px;border-radius:6px;background:linear-gradient(90deg,#88ddee 0%,#00a3e0 10%,#0077aa 20%,#005588 30%,#004768 38%,#ffee00 40%,#ffaa00 50%,#ff8100 58%,#ff4400 60%,#c10000 70%,#5d0000 78%,#ffaaff 80%,#ff4eff 98%,#ffffff 100%)}
.legend .chips{display:flex;flex-wrap:wrap;gap:4px 9px;margin-top:6px}.legend .chips span{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}.legend .chips i{width:14px;height:10px;border-radius:2px;display:inline-block}
#frBar [hidden],#frHelp[hidden]{display:none!important}
.legend .tk{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;margin-top:3px;opacity:.85}
.tkp{position:relative;height:14px;margin-top:3px;opacity:.85}.tkp span{position:absolute;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.cls{list-style:none;margin:9px 0 0;padding:0}
.cls li{display:grid;grid-template-columns:16px 1fr auto;column-gap:8px;align-items:center;margin:5px 0}
.cls i{width:16px;height:11px;border-radius:3px;border:1px solid rgba(255,255,255,.2)}
.cls b{font-weight:600}
.cls span{opacity:.9;font-variant-numeric:tabular-nums}
.cls em{grid-column:2/4;font-style:normal;opacity:.6;font-size:10px}
.legend .tn{margin-top:7px;opacity:.6;font-size:10px;line-height:1.3}
.legend .tm{margin-top:7px;padding-top:6px;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between}
.legend .sl{margin-top:9px;padding-top:8px;border-top:1px solid rgba(255,255,255,.14)}
.legend .sl .st{font-weight:600;margin-bottom:5px}
.wkey{display:inline-flex;gap:8px;align-items:center;font-size:10.5px;color:var(--mut);margin-right:4px}
.wkey i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:3px;vertical-align:-1px}
#synmap{height:640px;border-radius:12px;overflow:hidden;background:var(--dc)}
.maptool{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.maptool .vs{width:1px;height:22px;background:var(--bd);margin:0 4px}
.maptool input[type=range]{width:150px;padding:0}
#rvT{min-width:44px;font-variant-numeric:tabular-nums;color:var(--tx);font-weight:600}
#ltCfg{margin-top:10px;font-size:12px;color:var(--mut)}
#ltCfg input{flex:1;min-width:220px}
.cred{font-size:11px;color:var(--mut);margin-top:8px}
.cred a{color:var(--lnk)}
footer a{color:var(--lnk)}
footer{margin:26px 0 8px;padding-top:14px;border-top:1px solid var(--bd);color:var(--mut);font-size:11.5px;line-height:1.6}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
@media(max-width:700px){
 header{position:static;padding:10px 12px;gap:6px}
 h1{font-size:14px;margin:0;white-space:nowrap;flex:1 1 auto;min-width:0}
 h1{flex:1;width:auto}
 select,button{font-size:13px;padding:7px 10px}
 main{padding:10px 12px}
 #st{padding:8px 12px 0}
 .grid{grid-template-columns:1fr}
 .ch{height:260px!important}
 .card{padding:10px;border-radius:14px}
 .card h2{font-size:11px}
 .dc{min-width:150px}
 .mc select{max-width:110px}
 .mini{padding:4px 9px;font-size:12px}
 #mapbox,#synmap{height:62vh}
 .legend{width:220px;font-size:10.5px}
 .maptool input[type=range]{width:110px}
 summary{padding:6px 0}
}
</style>
</head>
<body>
<header>
  <h1><span data-i="title"></span></h1>
  <span class="sp2"></span>
  <button id="lang">EN</button>
  <span class="seg" id="thm"><button data-t="dark" data-i-t="th_d" aria-label="dark">&#127769;</button><button data-t="light" data-i-t="th_l" aria-label="light">&#9728;&#65039;</button></span>
  <button id="go" data-i-t="update" aria-label="update"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg></button>
  <div class="brk"></div>
  <span class="seg" id="tabs">
    <button data-tab="fc" class="on ib" data-i-t="tab_fc" aria-label="forecast"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1-.5-7.97A5.5 5.5 0 0 1 17 8.5a4.75 4.75 0 0 1 .5 9.5H7z"/></svg></button>
    <button data-tab="mg" class="ib" data-i-t="tab_mg" aria-label="meteogram"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></button>
    <button data-tab="map" class="ib" data-i-t="tab_map" aria-label="map"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 3 6-2.5v-13L15 7z"/><path d="M9 4v13M15 7v13"/></svg></button>
    <button data-tab="syn" class="ib" data-i-t="tab_syn" aria-label="synoptic"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c3-9 15-9 18-3"/><path d="M5 19c2-6 10-7 14-3"/><circle cx="12" cy="10.5" r="1.4"/></svg></button>
  </span>
  <select id="dist"></select>
  <select id="days"><option value="3" data-i="d3"></option><option value="5" data-i="d5"></option><option value="7" data-i="d7" selected></option></select>
  <span class="seg" id="cyc"><button data-h="0">00Z</button><button data-h="6">06Z</button><button data-h="12">12Z</button><button data-h="18">18Z</button></span>
  <button id="bMean" class="on" data-i="mean"></button>
  <button id="arc" data-i="arc"></button>
</header>
<div id="st"></div>
<main>
<section id="v-fc">
  <div class="models" id="models"></div>
  <div class="card"><h2><span data-i="sum"></span><span class="seg" id="ssrc"></span></h2><div id="sum"></div></div>
  <div class="ctl" style="margin:0 0 8px"><span data-i="ord"></span><button class="mini" id="ordr" data-i="ordr"></button></div>
  <div class="grid" id="charts"></div>
</section>
<section id="v-mg" hidden>
  <div class="card"><div class="ctl"><span data-i="mgs"></span><select id="mgSrc"></select>
    <button id="mgb" class="on" data-i="mgb"></button><button id="png" data-i="png"></button></div></div>
  <div id="mgInfo" class="ctl" style="margin-bottom:10px"></div>
  <div id="mg" style="display:grid;gap:12px"></div>
</section>
<section id="v-map" hidden>
  <div class="card" id="mapSetup" hidden>
    <h2><span data-i="mp_setup"></span></h2>
    <p class="ctl" data-i="mp_help"></p>
    <div class="ctl"><input id="mbIn" placeholder="pk.eyJ1..." autocomplete="off" spellcheck="false" style="min-width:260px;flex:1"><button id="mbSave" class="on" data-i="mp_save"></button></div>
    <div id="mbErr" class="err" style="margin-top:6px"></div>
  </div>
  <div class="card" id="mapWrap">
    <div class="maptool">
      <button id="mtR" class="ib on" data-i-t="mp_radar" aria-label="radar"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 19 6"/></svg></button>
      <button id="mtL" class="ib" data-i-t="mp_light" aria-label="lightning"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></button>
      <span class="vs"></span>
      <span id="rvCtl" class="seg"><button id="rvP" class="ib" data-i-t="mp_play" aria-label="play"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg></button><input id="rvS" type="range" min="0" max="0" value="0"><span id="rvT">–</span></span>
      <span class="sp2"></span>
      <button id="mtB" class="ib" data-i-t="mp_bm" aria-label="satellite basemap"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></button>
      <button id="mtK" class="ib" data-i-t="mp_clear" aria-label="token"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/></svg></button>
    </div>
    <div class="mapw"><div id="mapbox"></div>
      <div id="rvLeg" class="legend">
        <button class="lg-h" id="lgT" type="button"><span data-i="mp_leg"></span><span class="chev">&#9662;</span></button>
        <div class="lg-b">
          <div class="bar"></div>
          <div class="tk"><span>15</span><span>25</span><span>35</span><span>45</span><span>55</span><span>65+ dBZ</span></div>
          <ul class="cls">
            <li><i style="background:#00a3e0"></i><b data-i="lg1"></b><span>15–25 dBZ</span><em>0.3–1.3 mm/h</em></li>
            <li><i style="background:#005588"></i><b data-i="lg2"></b><span>25–35 dBZ</span><em>1.3–5.6 mm/h</em></li>
            <li><i style="background:#ffaa00"></i><b data-i="lg3"></b><span>35–45 dBZ</span><em>5.6–24 mm/h</em></li>
            <li><i style="background:#c10000"></i><b data-i="lg4"></b><span>45–55 dBZ</span><em>24–100 mm/h</em></li>
            <li><i style="background:#ff77ff"></i><b data-i="lg5"></b><span>&ge;55 dBZ</span><em>&gt;100 mm/h</em></li>
          </ul>
          <div class="tn" data-i="mp_legn"></div>
          <div class="tm"><span data-i="lg_time"></span><b id="rvLegT">–</b></div>
        </div>
      </div></div>
    <div id="ltCfg" hidden>
      <div class="ctl" style="margin-bottom:6px"><span data-i="mp_lurl"></span><b id="ltN" style="color:var(--tx)"></b></div>
      <div class="ctl"><input id="ltIn" placeholder="https://.../strikes.geojson" autocomplete="off" spellcheck="false"><button id="ltSave" data-i="mp_save"></button><a id="ltLM" href="https://www.lightningmaps.org/" target="_blank" rel="noopener" data-i="mp_lopen" style="color:var(--lnk)"></a></div>
      <div style="margin-top:6px" data-i="mp_lhelp"></div>
    </div>
    <div id="mapMsg" class="ctl" style="margin-top:6px"></div>
    <div class="cred"><a href="https://www.rainviewer.com/" target="_blank" rel="noopener">Weather data by Rain Viewer</a> · <span data-i="mp_rv"></span> · © Mapbox © OpenStreetMap</div>
  </div>
</section>
<section id="v-syn" hidden>
  <div class="card">
    <div class="maptool">
      <select id="synM"></select>
      <span class="seg" id="synF"><button class="mini on" data-f="msl">MSLP</button><button class="mini" data-f="z500">500 hPa</button><button class="mini" data-f="t850">850 hPa T</button><button class="mini" data-f="t2" data-i="sy_b_t2"></button><button class="mini" data-f="pr" data-i="sy_b_pr"></button><button class="mini" data-f="wi" data-i="sy_b_wi"></button><button class="mini" data-f="cc" data-i="sy_b_cc"></button></span>
      <span class="vs"></span>
      <span class="seg"><button id="synP" class="ib" data-i-t="mp_play" aria-label="play"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16l13-8z"/></svg></button><input id="synS" type="range" min="0" max="0" value="0"><span id="synT" style="min-width:120px;color:var(--tx);font-weight:600">–</span></span>
      <span class="sp2"></span><span id="synInfo" class="ctl"></span>
    </div>
    <div class="maptool" id="frBar">
      <button id="frT" class="mini" data-i="fr_tool"></button>
      <span class="seg" id="frTy" hidden>
        <button class="mini on" data-ty="cold" data-i="fr_cold" style="border-bottom:3px solid #1c7ed6"></button><button class="mini" data-ty="warm" data-i="fr_warm" style="border-bottom:3px solid #e03131"></button><button class="mini" data-ty="occ" data-i="fr_occ" style="border-bottom:3px solid #9c36b5"></button><button class="mini" data-ty="stat" data-i="fr_stat" style="border-bottom:3px solid #e03131"></button><button class="mini" data-ty="trough" data-i="fr_trough" style="border-bottom:3px dashed #a0713c"></button>
      </span>
      <button id="frDone" class="mini" hidden data-i="fr_done"></button>
      <span class="vs"></span>
      <button id="frUndo" class="mini" data-i="fr_undo"></button><button id="frFlip" class="mini" data-i="fr_flip"></button><button id="frClr" class="mini" data-i="fr_clr"></button><button id="frAll" class="mini" data-i="fr_all"></button><button id="frPng" class="mini" data-i="fr_png"></button>
    </div>
    <div class="cred" id="frHelp" hidden data-i="fr_help" style="margin:4px 0"></div>
    <div class="mapw"><div id="synmap"></div><div id="synLeg" class="legend"></div></div>
    <div id="synMsg" class="ctl" style="margin-top:6px"></div>
    <div class="cred" data-i="sy_note"></div>
  </div>
</section>
<footer id="ft"></footer>

function cr(p0,p1,p2,p3,t){return p1+.5*t*(p2-p0+t*(2*p0-5*p1+4*p2-p3+t*(3*(p1-p2)+p3-p0)))}

function extrema(U,W,H,r){

  const h=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));
  if(v<=TCOL[0][0])return TCOL[0][1];if(v>=TCOL[TCOL.length-1][0])return TCOL[TCOL.length-1][1];
  for(let i=0;i<TCOL.length-1;i++){const [a,ca]=TCOL[i],[b,cb]=TCOL[i+1];if(v>=a&&v<=b){const f=(v-a)/(b-a),x=h(ca),y=h(cb);return "#"+x.map((c,k)=>Math.round(c+(y[k]-c)*f).toString(16).padStart(2,"0")).join("")}}
  return "#ffffff";
}
const SYN2=new Set(["t2","pr","wi","cc"]);
const gv=(h,k)=>h[k]||h[Object.keys(h).find(x=>x.startsWith(k)&&x!=="time")]||[];
const nz=v=>v==null?NaN:v;
async function gfetch(u){
  for(let a=0;a<4;a++){
    const r=await fetch(u);
    if(r.status===429&&a<3){await new Promise(s=>setTimeout(s,2500*(a+1)));continue}
    if(!r.ok)throw new Error("HTTP "+r.status);
    return r.json();
  }
}
async function gridFetch(m,tag,vars,pick){
  const ck=`${tag}|${m}|${META[m]||"x"}`,cached=META[m]?await aget(ck):null;
  if(cached&&cached.o)return cached.o;
  const lats=[],lons=[];for(let j=0;j<SY.H;j++)for(let i=0;i<SY.W;i++){lats.push(SY.lat0+j*SY.d);lons.push(SY.lon0+i*SY.d)}
  const res=[],B=75;
  for(let s=0;s<lats.length;s+=B){
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${lats.slice(s,s+B).join(",")}&longitude=${lons.slice(s,s+B).join(",")}&hourly=${vars.join(",")}&models=${M[m].id}&forecast_days=4&timezone=UTC`;
    const j=await gfetch(u);res.push(...(Array.isArray(j)?j:[j]));
  }
  if(res.length!==lats.length)throw new Error("grid "+res.length+"/"+lats.length);
  const T=res[0].hourly.time,ix=T.map((x,i)=>+x.slice(11,13)%3===0?i:-1).filter(i=>i>=0),o={times:ix.map(i=>T[i])};
  Object.keys(pick).forEach(f=>{o[f]=ix.map(i=>res.map(r=>pick[f](r.hourly,i)))});
  if(META[m])aput(ck,{o});
  return o;
}

const PR_B=[[.1,"#a5d8ff"],[.5,"#74c0fc"],[1,"#4dabf7"],[2,"#228be6"],[5,"#40c057"],[10,"#fab005"],[20,"#fd7e14"],[40,"#e03131"],[80,"#9c36b5"]];
const WS_B=[[10,"#d0ebff"],[20,"#74c0fc"],[30,"#51cf66"],[40,"#c0eb75"],[50,"#ffd43b"],[65,"#ff922b"],[80,"#f03e3e"],[100,"#c2255c"]];
function fcStyle(f,v,dk){
  if(!isFinite(v))return null;
  if(f==="t2")return [tcol(Math.round(v/2)*2),.6];
  if(f==="pr"){let c=null;for(const b of PR_B)if(v>=b[0])c=b[1];return c?[c,.7]:null}
  if(f==="wi"){let c=null;for(const b of WS_B)if(v>=b[0])c=b[1];return c?[c,.55]:null}
  if(f==="cc")return v<10?null:[dk?"#e9ecef":"#495057",Math.round(v/100*.7*8)/8];
  return null;
}
function fillFC(U,f,dk){
  const W=SY.W2,H=SY.H2,feats=[],ll=p=>[SY.lon0+p[0]*SY.d/SY.k,SY.lat0+p[1]*SY.d/SY.k];
  const cv=(x,y)=>(U[y*W+x]+U[y*W+x+1]+U[(y+1)*W+x]+U[(y+1)*W+x+1])/4;
  for(let y=0;y<H-1;y++){let x=0;
    while(x<W-1){
      const s=fcStyle(f,cv(x,y),dk);
      if(!s){x++;continue}
      let x2=x+1;
      while(x2<W-1){const s2=fcStyle(f,cv(x2,y),dk);if(!s2||s2[0]!==s[0]||s2[1]!==s[1])break;x2++}
      feats.push({type:"Feature",properties:{c:s[0],o:s[1]},geometry:{type:"Polygon",coordinates:[[ll([x,y]),ll([x2,y]),ll([x2,y+1]),ll([x,y+1]),ll([x,y])]]}});
      x=x2;
    }
  }
  return {type:"FeatureCollection",features:feats};
}
const chipsLeg=(a,u)=>`<div class="chips">${a.map(b=>`<span><i style="background:${b[1]}"></i>${b[0]}</span>`).join("")}</div><div class="tn">${u}</div>`;

function chaikin(pts,n=3){let p=pts;for(let k=0;k<n&&p.length>2;k++){const q=[p[0]];for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1];q.push([.75*a[0]+.25*b[0],.75*a[1]+.25*b[1]],[.25*a[0]+.75*b[0],.25*a[1]+.75*b[1]])}q.push(p[p.length-1]);p=q}return p}

function synImgs(){
  const mk=(n,w,h,draw,sdf)=>{if(SM.hasImage(n))return;const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");draw(x);SM.addImage(n,x.getImageData(0,0,w,h),{pixelRatio:2,sdf:!!sdf})};
  const tri=(x,cx,col)=>{x.fillStyle=col;x.beginPath();x.moveTo(cx-13,28);x.lineTo(cx+13,28);x.lineTo(cx,50);x.closePath();x.fill()};
  const semB=(x,cx,col)=>{x.fillStyle=col;x.beginPath();x.arc(cx,28,13,0,Math.PI,false);x.closePath();x.fill()};
  const semT=(x,cx,col)=>{x.fillStyle=col;x.beginPath();x.arc(cx,28,13,Math.PI,2*Math.PI,false);x.closePath();x.fill()};
  mk("arr",32,48,x=>{x.fillStyle="#fff";x.beginPath();x.moveTo(16,2);x.lineTo(28,22);x.lineTo(19,22);x.lineTo(19,46);x.lineTo(13,46);x.lineTo(13,22);x.lineTo(4,22);x.closePath();x.fill()},1);
  mk("fr-cold",56,56,x=>tri(x,28,FR_C.cold));
  mk("fr-warm",56,56,x=>semB(x,28,FR_C.warm));
  mk("fr-occ",112,56,x=>{tri(x,28,FR_C.occ);semB(x,84,FR_C.occ)});
  mk("fr-stat",112,56,x=>{tri(x,28,FR_C.cold);semT(x,84,FR_C.warm)});
}

addEventListener("keydown",e=>{if(!frOn||$("v-syn").hidden)return;if(e.key==="Enter")frFinish();if(e.key==="Escape"){frDraft=[];frRender()}});


addEventListener("error",e=>{const el=$("st");if(el&&e.message)el.innerHTML+=` <span class="err">⚠ ${e.message}</span>`});
addEventListener("unhandledrejection",e=>{const el=$("st");if(el)el.innerHTML+=` <span class="err">⚠ ${(e.reason&&e.reason.message)||e.reason}</span>`});
let wasMB=MB();addEventListener("resize",()=>{if(MB()!==wasMB){wasMB=MB();render()}});
setTheme(theme,true);applyLang();loadAll();
</script>
</body>
</html>
